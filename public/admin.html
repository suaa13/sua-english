<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SUA English · 管理后台</title>
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    .admin-wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }
    .admin-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .admin-title { font-size: 26px; font-weight: 780; letter-spacing: -0.02em; margin: 0; }
    .admin-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
    .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
    .stat-box .v { font-size: 24px; font-weight: 760; letter-spacing: -0.02em; }
    .stat-box .k { color: var(--muted); font-size: 12px; margin-top: 2px; }
    table.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.admin-table th, table.admin-table td { padding: 10px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    table.admin-table th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
    table.admin-table tbody tr:hover { background: var(--surface-2); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
    .kv span:first-child { color: var(--muted); }
    .scroll-box { max-height: 320px; overflow: auto; border: 1px solid var(--border); border-radius: 12px; }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .toast-line { font-size: 13px; }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-head">
      <div>
        <h1 class="admin-title">SUA English · 管理后台</h1>
        <div class="admin-sub">查看已注册用户及其产生的学习数据（数据源：PostgreSQL / Supabase）</div>
      </div>
      <div class="row" id="head-actions" style="display:none">
        <a class="btn btn-ghost btn-sm" href="./#/home">← 返回站点</a>
        <button class="btn btn-soft btn-sm" id="btn-refresh">刷新</button>
        <button class="btn btn-soft btn-sm" id="btn-csv">导出 CSV</button>
        <button class="btn btn-sm" id="btn-logout">退出</button>
      </div>
    </div>

    <!-- 登录 -->
    <section class="card" id="gate" style="padding:20px">
      <div class="card-title mb-3">管理员登录</div>
      <p class="muted" style="font-size:13px;margin:0 0 12px">
        使用管理员账号密码登录。登录凭证只保存在你本机浏览器，12 小时后自动失效。
      </p>
      <div class="row">
        <input id="username" placeholder="管理员账号" autocomplete="username" style="flex:1;min-width:170px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)" />
        <input id="password" type="password" placeholder="密码" autocomplete="current-password" style="flex:1;min-width:170px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)" />
        <button class="btn btn-primary" id="btn-login">登录</button>
      </div>
      <div class="muted toast-line" id="gate-msg" style="margin-top:10px"></div>
    </section>

    <!-- 主体 -->
    <div id="main" style="display:none">
      <section class="stat-grid" id="overview"></section>

      <section class="card" style="padding:16px;margin-bottom:18px">
        <div class="row">
          <input id="q" placeholder="搜索邮箱或用户名" style="flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)" />
          <button class="btn btn-primary btn-sm" id="btn-search">搜索</button>
          <button class="btn btn-ghost btn-sm" id="btn-clear">清空</button>
          <div class="spacer"></div>
          <button class="btn btn-sm" id="prev">上一页</button>
          <span class="muted" id="page-label" style="font-size:13px">1 / 1</span>
          <button class="btn btn-sm" id="next">下一页</button>
        </div>
      </section>

      <section class="card" style="padding:0;overflow:hidden">
        <div style="overflow-x:auto">
          <table class="admin-table">
            <thead>
              <tr>
                <th>用户</th><th>注册时间</th><th>目标</th><th>积分</th>
                <th>练过的词</th><th>错题</th><th>活跃天数</th><th>累计答题</th><th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>

      <section class="card" id="detail" style="padding:18px;margin-top:18px;display:none"></section>
    </div>
  </div>

  <script>
    (function () {
      var API = (window.__SUA_API_BASE__) || (location.origin + '/api/v1');
      var TOKEN_KEY = 'sua-admin-jwt';
      var EXP_KEY = 'sua-admin-exp';
      var state = { page: 1, pageSize: 20, q: '', total: 0 };

      var $ = function (id) { return document.getElementById(id); };

      function jwt() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
      function exp() { try { return Number(localStorage.getItem(EXP_KEY) || 0); } catch (e) { return 0; } }
      function setSession(token, expiresAt) {
        try {
          if (token) {
            localStorage.setItem(TOKEN_KEY, token);
            localStorage.setItem(EXP_KEY, String(expiresAt || 0));
          } else {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(EXP_KEY);
          }
        } catch (e) {}
      }
      function clearSession() { setSession('', 0); }
      /** 本地判断会话是否还在有效期内（真正的判定仍以服务端 401 为准）。 */
      function hasLiveSession() { return !!jwt() && (!exp() || exp() > Date.now()); }

      function authHeaders(extra) {
        return Object.assign({ Authorization: 'Bearer ' + jwt() }, extra || {});
      }

      async function call(path, opts) {
        var o = Object.assign({}, opts || {});
        o.headers = authHeaders(o.headers);
        var res = await fetch(API + path, o);
        var body = null;
        try { body = await res.json(); } catch (e) { body = null; }
        if (res.status === 401 || res.status === 503) {
          if (res.status === 401) clearSession();
          var err = new Error((body && body.message) || (res.status === 503 ? '管理后台未启用' : '登录已失效，请重新登录'));
          err.code = res.status;
          throw err;
        }
        if (!res.ok) throw new Error((body && body.message) || ('请求失败 ' + res.status));
        return body && body.data !== undefined ? body.data : body;
      }

      function fmtDate(v) {
        if (!v) return '—';
        var d = new Date(v);
        return isNaN(d.getTime()) ? String(v) : d.toLocaleString('zh-CN', { hour12: false });
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
        });
      }

      // ---------------- 登录 ----------------
      async function enter() {
        var u = ($('username').value || '').trim();
        var p = $('password').value || '';
        if (!u || !p) { $('gate-msg').textContent = '请输入账号和密码'; return; }
        $('btn-login').disabled = true;
        $('gate-msg').textContent = '登录中…';
        try {
          var res = await fetch(API + '/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p }),
          });
          var body = await res.json().catch(function () { return null; });
          var data = body && body.data !== undefined ? body.data : body;
          if (!res.ok) throw new Error((body && body.message) || '登录失败');
          setSession(data.token, data.expiresAt);
          $('password').value = '';
          $('gate-msg').textContent = '';
          await showMain();
        } catch (e) {
          clearSession();
          $('gate-msg').textContent = (e && e.message) || '登录失败';
        } finally {
          $('btn-login').disabled = false;
        }
      }

      async function showMain() {
        await loadOverview();
        await loadUsers();
        $('gate').style.display = 'none';
        $('main').style.display = '';
        $('head-actions').style.display = '';
      }

      function showGate(msg) {
        $('main').style.display = 'none';
        $('head-actions').style.display = 'none';
        $('gate').style.display = '';
        if (msg) $('gate-msg').textContent = msg;
      }

      // ---------------- 概览 ----------------
      async function loadOverview() {
        var d = await call('/admin/overview');
        var cards = [
          ['注册用户', d.users], ['近 7 天新增', d.newUsers7d], ['有学习记录', d.activeUsers],
          ['学习进度条数', d.progressRows], ['错题条数', d.wrongQuestions],
          ['学习打卡天数', d.studySessions], ['学习计划', d.studyPlans], ['主状态快照', d.appStates],
        ];
        $('overview').innerHTML = cards.map(function (c) {
          return '<div class="stat-box"><div class="v">' + c[1] + '</div><div class="k">' + c[0] + '</div></div>';
        }).join('') +
          '<div class="stat-box" style="grid-column:1/-1"><div class="k">存储位置</div>' +
          '<div style="margin-top:4px;font-size:13px">' + esc(d.storage.engine) + ' · ' + esc(d.storage.note) + '</div></div>';
      }

      // ---------------- 用户列表 ----------------
      async function loadUsers() {
        var qs = '?page=' + state.page + '&pageSize=' + state.pageSize + (state.q ? '&q=' + encodeURIComponent(state.q) : '');
        var d = await call('/admin/users' + qs);
        state.total = d.total || 0;
        var pages = Math.max(1, Math.ceil(state.total / state.pageSize));
        $('page-label').textContent = state.page + ' / ' + pages + '（共 ' + state.total + ' 人）';
        $('rows').innerHTML = (d.items || []).map(function (u) {
          var c = u.counts || {};
          // 真实学习数据在 appSummary（UserAppState 快照）里；关系表仅作兜底。
          var a = u.appSummary || null;
          var words = a ? a.vocabTracked : ((u.profile && u.profile.vocabularySize) || 0);
          var errors = a ? a.errors : (c.wrongQuestions || 0);
          var days = a ? a.activityDays : (c.studySessions || 0);
          var items = a ? a.totalItems : '—';
          return '<tr>' +
            '<td><div style="font-weight:600">' + esc(u.username) + '</div><div class="mono muted">' + esc(u.email) + '</div></td>' +
            '<td class="mono">' + fmtDate(u.createdAt) + '</td>' +
            '<td>' + esc(u.targetExam || '—') + (u.targetScore ? ' ' + esc(u.targetScore) : '') + '</td>' +
            '<td>' + (u.credits == null ? '—' : u.credits) + '</td>' +
            '<td>' + words + ' 词' + (a && a.vocabKnown ? '<div class="muted" style="font-size:11px">已掌握 ' + a.vocabKnown + '</div>' : '') + '</td>' +
            '<td>' + errors + '</td>' +
            '<td>' + days + '</td>' +
            '<td>' + items + '</td>' +
            '<td><button class="btn btn-soft btn-sm" data-id="' + esc(u.id) + '">详情</button></td>' +
            '</tr>';
        }).join('') || '<tr><td colspan="9" class="muted">暂无用户</td></tr>';

        Array.prototype.forEach.call($('rows').querySelectorAll('button[data-id]'), function (b) {
          b.onclick = function () { openDetail(b.getAttribute('data-id')); };
        });
      }

      // ---------------- 用户详情 ----------------
      async function openDetail(id) {
        var el = $('detail');
        el.style.display = '';
        el.innerHTML = '<div class="muted">加载中…</div>';
        var d;
        try { d = await call('/admin/users/' + encodeURIComponent(id)); }
        catch (e) { el.innerHTML = '<div class="muted">' + esc(e.message) + '</div>'; return; }

        var u = d.user, p = d.profile || {}, s = (d.appState && d.appState.summary) || null;
        var kv = function (k, v) { return '<div class="kv"><span>' + k + '</span><span>' + v + '</span></div>'; };

        el.innerHTML =
          '<div class="row" style="justify-content:space-between;margin-bottom:12px">' +
            '<div><div style="font-size:18px;font-weight:720">' + esc(u.username) + ' <span class="mono muted" style="font-size:13px">' + esc(u.email) + '</span></div>' +
            '<div class="admin-sub">注册于 ' + fmtDate(u.createdAt) + ' · ID <span class="mono">' + esc(u.id) + '</span></div></div>' +
            '<button class="btn btn-ghost btn-sm" id="btn-close">收起</button>' +
          '</div>' +
          '<div class="detail-grid">' +
            '<div><div class="card-title mb-2">账号</div>' +
              kv('目标考试', esc(u.targetExam || '—')) + kv('目标分数', esc(u.targetScore == null ? '—' : u.targetScore)) +
              kv('当前水平', esc(u.currentLevel || '—')) + kv('每日时长', esc(u.dailyStudyMinutes || '—') + ' 分钟') +
              kv('积分', esc(u.credits)) + kv('最近签到', esc(u.lastCheckIn || '未签到')) +
            '</div>' +
            '<div><div class="card-title mb-2">学习画像</div>' +
              kv('词汇量', esc(s ? s.vocabTracked : (p.vocabularySize || 0))) +
              kv('学习天数', esc(s ? s.activityDays : (p.studyDays || 0))) +
              kv('累计分钟', esc(s ? s.totalMinutes : (p.totalStudyMinutes || 0))) +
              kv('等级', esc(p.englishLevel || u.currentLevel || '—')) +
              kv('IELTS 目标', esc(p.ieltsTarget || (u.targetExam === 'IELTS' ? u.targetScore : '') || '—')) +
              kv('TOEFL 目标', esc(p.toeflTarget || (u.targetExam === 'TOEFL' ? u.targetScore : '') || '—')) +
            '</div>' +
            '<div><div class="card-title mb-2">学习数据（主状态快照）</div>' +
              (s ? (kv('练过的词', s.vocabTracked + '（已掌握 ' + s.vocabKnown + '）') +
                    kv('累计答题', s.totalItems + ' 题 / ' + s.totalMinutes + ' 分钟') +
                    kv('活跃天数', s.activityDays) + kv('错题记录', s.errors) +
                    kv('模考次数', s.mocks) + kv('连续天数', s.streak == null ? '—' : s.streak) +
                    kv('有计划', s.hasPlan ? '是' : '否') + kv('最后保存', fmtDate(s.savedAt)))
                  : '<div class="muted" style="font-size:13px">该账号还没有产生主状态数据。</div>') +
            '</div>' +
            '<div><div class="card-title mb-2">能力诊断 / 计划</div>' +
              kv('CEFR 综合', esc(d.cefr ? d.cefr.overall : '—')) +
              kv('学习计划', d.studyPlan ? (esc(d.studyPlan.goal) + ' · 每日 ' + esc(d.studyPlan.daily) + ' 题') : '—') +
              kv('计划连续', d.studyPlan ? esc(d.studyPlan.streak) : '—') +
              kv('周复盘', (d.weeklyReviews || []).length + ' 条') +
            '</div>' +
          '</div>' +
          '<div class="detail-grid" style="margin-top:16px">' +
            '<div><div class="card-title mb-2">学习进度（最近 ' + (d.progress || []).length + ' 条）</div>' +
              '<div class="scroll-box"><table class="admin-table"><thead><tr><th>类型</th><th>状态</th><th>正确/总数</th></tr></thead><tbody>' +
              ((d.progress || []).map(function (x) {
                return '<tr><td>' + esc(x.itemType) + '</td><td>' + esc(x.status) + '</td><td>' + esc(x.correctCount) + ' / ' + esc(x.totalCount) + '</td></tr>';
              }).join('') || '<tr><td colspan="3" class="muted">无</td></tr>') +
              '</tbody></table></div></div>' +
            '<div><div class="card-title mb-2">错题本（最近 ' + (d.wrongQuestions || []).length + ' 条）</div>' +
              '<div class="scroll-box"><table class="admin-table"><thead><tr><th>科目</th><th>标题</th><th>加入时间</th></tr></thead><tbody>' +
              ((d.wrongQuestions || []).map(function (x) {
                return '<tr><td>' + esc(x.subject || x.exam || '—') + '</td><td>' + esc((x.title || '').slice(0, 40) || '—') + '</td><td class="mono">' + fmtDate(x.wrongAt) + '</td></tr>';
              }).join('') || '<tr><td colspan="3" class="muted">无</td></tr>') +
              '</tbody></table></div></div>' +
          '</div>' +
          '<div style="margin-top:14px"><div class="card-title mb-2">学习打卡日期（最近 ' + (d.studySessions || []).length + ' 天）</div>' +
            '<div class="row">' + ((d.studySessions || []).map(function (x) { return '<span class="pill">' + esc(x.date) + '</span>'; }).join('') || '<span class="muted" style="font-size:13px">无</span>') + '</div>' +
          '</div>';

        $('btn-close').onclick = function () { el.style.display = 'none'; };
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      // ---------------- 事件 ----------------
      $('btn-login').onclick = enter;
      $('username').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('password').focus(); });
      $('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') enter(); });
      $('btn-refresh').onclick = function () {
        loadOverview().then(loadUsers).catch(function (e) { if (e.code === 401) showGate(e.message); else alert(e.message); });
      };
      $('btn-search').onclick = function () { state.q = ($('q').value || '').trim(); state.page = 1; loadUsers().catch(function (e) { if (e.code === 401) showGate(e.message); else alert(e.message); }); };
      $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btn-search').click(); });
      $('btn-clear').onclick = function () { $('q').value = ''; state.q = ''; state.page = 1; loadUsers().catch(function (e) { if (e.code === 401) showGate(e.message); else alert(e.message); }); };
      $('prev').onclick = function () { if (state.page > 1) { state.page--; loadUsers().catch(function (e) { if (e.code === 401) showGate(e.message); }); } };
      $('next').onclick = function () { state.page++; loadUsers().catch(function (e) { if (e.code === 401) showGate(e.message); else alert(e.message); }); };
      $('btn-logout').onclick = function () { clearSession(); location.reload(); };
      $('btn-csv').onclick = function () {
        fetch(API + '/admin/users.csv', { headers: authHeaders() })
          .then(function (r) {
            if (r.status === 401) { clearSession(); showGate('登录已失效，请重新登录'); throw new Error('登录已失效'); }
            return r.text();
          })
          .then(function (raw) {
            // 后端统一用 { success, data } 包装，CSV 在 data 字段里，需要解包。
            var text = raw;
            try {
              var j = JSON.parse(raw);
              if (j && typeof j.data === 'string') text = j.data;
            } catch (e) { /* 本身就是纯 CSV */ }
            return text;
          })
          .then(function (text) {
            var a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' }));
            a.download = 'sua-users.csv';
            a.click();
          })
          .catch(function (e) { if (e.message !== '登录已失效') alert(e.message); });
      };

      // 已有有效会话则直接进入，否则显示登录表单
      if (hasLiveSession()) {
        $('gate-msg').textContent = '恢复登录中…';
        showMain().catch(function () {
          clearSession();
          showGate('登录已失效，请重新登录');
        });
      }
    })();
  </script>
</body>
</html>
