<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SUA English — IELTS & TOEFL 自学英语学习平台</title>
  <meta name="description" content="SUA English — 从真正的英语 0 基础，一路学到 IELTS / TOEFL。课程 + 练习 + 真题 + AI Tutor + 模考 + 学习数据，一体化 AI 英语学习系统。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- Apple Liquid Glass 折射滤镜：给玻璃材质加入有机的非均匀扭曲。
       Technique from github.com/arsalan06106/liquid-glass-html-css (MIT).
       Firefox 不支持 backdrop-filter: url()，会自动降级为纯模糊，见 app.css 的 -webkit- 回退。 -->
  <svg class="glass-filter-host" aria-hidden="true" focusable="false">
    <filter id="glass-blur" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.007" numOctaves="1" result="turbulence" />
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="14" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <div class="ambient" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="nav" id="nav"></header>
    <main id="app" class="container"></main>
    <footer class="footer">
      <div class="container">
        <div>© 2026 SUA English · 从 0 基础到 IELTS / TOEFL</div>
        <div class="row gap-4">
          <a href="#/ielts">IELTS</a>
          <a href="#/toefl">TOEFL</a>
          <a href="#/partner">AI Partner</a>
          <span class="faint">v1.0 MVP</span>
        </div>
      </div>
    </footer>
  </div>
  <div id="overlay-root"></div>
  <div class="toast-wrap" id="toast-root"></div>

  <!-- Infra -->
  <!-- 部署配置：先加载 config.js（设定 window.__SUA_API_BASE__），再加载 app.js -->
  <script src="assets/js/config.js"></script>
  <script src="assets/vendor/gsap.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
